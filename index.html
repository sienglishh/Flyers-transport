<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards Từ Vựng Tiếng Anh - Transport</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 {
      color: #0c2461;
      margin-bottom: 20px;
      font-size: 2rem;
      text-align: center;
      text-shadow: 0 2px 4px rgba(255,255,255,0.4);
    }

    .card {
      width: 340px;
      height: 420px;
      background: #ffffff;
      border-radius: 25px;
      box-shadow: 0 12px 25px rgba(0,0,0,0.15);
      border: 5px solid #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 30px 20px;
    }

    .icon {
      font-size: 5rem;
      margin-top: 10px;
    }

    .text-container {
      text-align: center;
    }

    .word {
      font-size: 2rem;
      font-weight: bold;
      color: #1e3799;
      margin-bottom: 8px;
    }

    .meaning {
      font-size: 1.4rem;
      font-weight: bold;
      color: #eb2f06;
    }

    .btn-audio {
      background: #1e3799;
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(30, 55, 153, 0.3);
      transition: transform 0.1s, background 0.2s;
    }

    .btn-audio:hover {
      background: #4a69bd;
      transform: scale(1.05);
    }

    .controls {
      margin-top: 30px;
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .btn-nav {
      background: #eb2f06;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 15px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(235, 47, 6, 0.3);
      transition: background 0.2s, transform 0.1s;
    }

    .btn-nav:hover {
      background: #e55039;
      transform: scale(1.05);
    }

    .progress {
      font-size: 1.2rem;
      font-weight: bold;
      color: #2d3436;
      background: rgba(255,255,255,0.9);
      padding: 8px 16px;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <h1>🚗 Transport & Travel 🚀</h1>

  <div class="card">
    <div class="icon" id="icon">🚑</div>
    
    <div class="text-container">
      <div class="word" id="word">ambulance</div>
      <div class="meaning" id="meaning">xe cứu thương</div>
    </div>

    <button class="btn-audio" onclick="speakCurrentWord()">🔊 Nghe đọc</button>
  </div>

  <div class="controls">
    <button class="btn-nav" onclick="prevCard()">◄ Trước</button>
    <div class="progress" id="progress">1 / 16</div>
    <button class="btn-nav" onclick="nextCard()">Sau ►</button>
  </div>

  <script>
    const vocabulary = [
      { word: "ambulance", meaning: "xe cứu thương", icon: "🚑" },
      { word: "bicycle", meaning: "xe đạp", icon: "🚲" },
      { word: "fire engine (US fire truck)", meaning: "xe cứu hỏa", icon: "🚒" },
      { word: "journey", meaning: "hành trình / chuyến đi", icon: "🗺️" },
      { word: "lift (ride)", meaning: "đi nhờ xe / quá giang", icon: "🚗" },
      { word: "motorway", meaning: "đường cao tốc", icon: "🛣️" },
      { word: "passenger", meaning: "hành khách", icon: "🧳" },
      { word: "platform", meaning: "sân ga / thềm ga", icon: "🚉" },
      { word: "racing (car; bike)", meaning: "xe đua", icon: "🏎️" },
      { word: "railway", meaning: "đường sắt", icon: "🛤️" },
      { word: "rocket", meaning: "tên lửa", icon: "🚀" },
      { word: "spaceship", meaning: "tàu vũ trụ", icon: "🛸" },
      { word: "taxi", meaning: "xe taxi", icon: "🚕" },
      { word: "tour", meaning: "chuyến du lịch", icon: "🧳" },
      { word: "traffic", meaning: "giao thông / xe cộ", icon: "🚦" },
      { word: "wheel", meaning: "bánh xe", icon: "🛞" }
    ];

    let currentIndex = 0;
    const wordElement = document.getElementById('word');
    const meaningElement = document.getElementById('meaning');
    const iconElement = document.getElementById('icon');
    const progressElement = document.getElementById('progress');

    function updateCard() {
      const item = vocabulary[currentIndex];
      wordElement.textContent = item.word;
      meaningElement.textContent = item.meaning;
      iconElement.textContent = item.icon;
      progressElement.textContent = `${currentIndex + 1} / ${vocabulary.length}`;
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        updateCard();
      }
    }

    function nextCard() {
      if (currentIndex < vocabulary.length - 1) {
        currentIndex++;
        updateCard();
      }
    }

    function speakCurrentWord() {
      const textToSpeak = vocabulary[currentIndex].word.replace(/\(.*?\)/g, '').trim();
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }

    updateCard();
  </script>
</body>
</html>
